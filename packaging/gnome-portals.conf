# Selects scopevault as the Secret portal backend on GNOME, for a system
# without /usr/share/xdg-desktop-portal/gnome-portals.conf. Install as
# ~/.config/xdg-desktop-portal/gnome-portals.conf. Where the system has
# that file, copy it there instead and change its Secret line (see
# docs/INSTALL.md): xdg-desktop-portal reads only the first
# gnome-portals.conf it finds (1.20 does), so a file naming only the
# Secret portal would drop the system's settings for every other one.
# Read at startup only: restart xdg-desktop-portal or log in again.
[preferred]
org.freedesktop.impl.portal.Secret=scopevault
