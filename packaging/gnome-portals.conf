# Selects scopevault as the Secret portal backend on GNOME. Install as
# ~/.config/xdg-desktop-portal/gnome-portals.conf (if that file exists
# already, add the line to its [preferred] group instead).
# xdg-desktop-portal consults this file before the system's
# gnome-portals.conf, and falls back to the system file for every interface
# not named here; there must be no `default=` line, or it would replace the
# system defaults. Read at startup only: restart xdg-desktop-portal or log
# in again.
[preferred]
org.freedesktop.impl.portal.Secret=scopevault
