[package]
name = "scopevault"
version = "0.12.8"
edition = "2024"

[dependencies]
aes = { version = "=0.9.3", features = ["zeroize"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
cbc = { version = "=0.2.1", features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
crypto-bigint = { version = "=0.7.5", features = ["zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hkdf = "=0.13.0"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process", "fs", "pipe", "thread", "param", "event", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zeroize = "1.9"

# Argon2 is about ten times slower unoptimised, which makes key derivation
# with real parameters take seconds in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
