[package]
name = "scopevault"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
rustix = { version = "1.1.5", features = ["process", "fs", "pipe", "thread", "param", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
